plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def devAutoLoadWorldName = providers.gradleProperty('geomantiaDevAutoLoadWorld')
        .orElse('')
        .get()
def devAutoLoadWorldBase64Override = providers.gradleProperty('geomantiaDevAutoLoadWorldBase64')
        .orElse('')
        .get()
def devAutoLoadWorldBase64 = !devAutoLoadWorldBase64Override.isBlank()
        ? devAutoLoadWorldBase64Override
        : devAutoLoadWorldName.isBlank()
        ? ''
        : java.util.Base64.getEncoder().encodeToString(devAutoLoadWorldName.getBytes('UTF-8'))
def devGisSmoke = providers.gradleProperty('geomantiaDevGisSmoke')
        .orElse('false')
        .get()
def devRealmSmoke = providers.gradleProperty('geomantiaDevRealmSmoke')
        .orElse('false')
        .get()
def devUseReTerraForged = providers.gradleProperty('geomantiaDevUseReTerraForged')
        .orElse('false')
        .get()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // TEMP dev-only convenience: auto-load a local save for smoke tests.
            // Remove this once the client validation harness no longer needs manual world entry.
            // Configure with gradle.properties or override explicitly:
            // ./gradlew.bat runClient -PgeomantiaDevAutoLoadWorld=<saveName>
            // For non-ASCII save names, prefer -PgeomantiaDevAutoLoadWorldBase64=<utf8Base64>.
            if (!devAutoLoadWorldBase64.isBlank()) {
                property 'geomantia.devAutoLoadWorldBase64', devAutoLoadWorldBase64
            }
            if (devGisSmoke.toBoolean()) {
                property 'geomantia.devGisSmoke', 'true'
            }
            if (devRealmSmoke.toBoolean()) {
                property 'geomantia.devRealmSmoke', 'true'
            }
            if (devUseReTerraForged.toBoolean()) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${project.layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'libs/local/reterraforged/0.0.5'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (devUseReTerraForged.toBoolean()) {
        runtimeOnly fg.deobf("local.reterraforged:reterraforged:0.0.5")
    }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    doLast {
        copy {
            from 'src/main/resources/gameteststructures'
            into 'run/gameteststructures'
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
