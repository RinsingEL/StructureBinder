plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def devAutoLoadWorldName = providers.gradleProperty('geomantiaDevAutoLoadWorld')
        .orElse('')
        .get()
def devAutoLoadWorldBase64Override = providers.gradleProperty('geomantiaDevAutoLoadWorldBase64')
        .orElse('')
        .get()
def devAutoLoadWorldBase64 = !devAutoLoadWorldBase64Override.isBlank()
        ? devAutoLoadWorldBase64Override
        : devAutoLoadWorldName.isBlank()
        ? ''
        : java.util.Base64.getEncoder().encodeToString(devAutoLoadWorldName.getBytes('UTF-8'))
def devUseStructurePacks = providers.gradleProperty('geomantiaDevUseStructurePacks')
        .orElse('false')
        .get()
def devUseReTerraForged = providers.gradleProperty('geomantiaDevUseReTerraForged')
        .orElse('false')
        .get()
def devUseVisualPreview = providers.gradleProperty('geomantiaDevUseVisualPreview')
        .orElse('false')
        .get()
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.config', 'geomantia.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (!devAutoLoadWorldBase64.isBlank()) {
                property 'geomantia.devAutoLoadWorldBase64', devAutoLoadWorldBase64
            }
            if (devUseReTerraForged.toBoolean()) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${project.layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
            includeGroup "me.shedaniel"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    flatDir {
        dirs 'libs/local/reterraforged/0.0.5'
        dirs 'libs/local/trek/B0.6'
        dirs 'libs/local/t_and_t/1.12'
        dirs 'libs/local/cristellib/1.1.6'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (devUseReTerraForged.toBoolean()) {
        runtimeOnly fg.deobf("local.reterraforged:reterraforged:0.0.5")
    }
    if (devUseStructurePacks.toBoolean()) {
        runtimeOnly fg.deobf("local.trek:trek:B0.6")
        runtimeOnly fg.deobf("local.t_and_t:t_and_t:1.12")
        runtimeOnly fg.deobf("local.cristellib:cristellib:1.1.6")
    }
    if (devUseVisualPreview.toBoolean()) {
        // ForgeGradle must remap client mods before a userdev run can load them.
        runtimeOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1')
        runtimeOnly fg.deobf('maven.modrinth:oculus:iQ1SwGc3')
        runtimeOnly fg.deobf('maven.modrinth:distanthorizons:FWGxbEM3')
    }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    doLast {
        copy {
            from 'src/main/resources/gameteststructures'
            into 'run/gameteststructures'
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'geomantia.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
