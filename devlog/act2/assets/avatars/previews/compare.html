<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开放日 · 两版角色对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe4;color:#322d29;font:16px system-ui,'Microsoft YaHei',sans-serif}header{padding:24px 32px;border-bottom:1px solid #b6a893;background:#fffaf0;position:sticky;top:0;z-index:2}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#6b6259}button,select{font:inherit;padding:8px 14px;border:1px solid #b4a68e;border-radius:8px;background:#fff;cursor:pointer;margin:4px}button[aria-pressed=true]{background:#735741;color:white}main{padding:16px 24px}section{margin:12px 0 28px}h2{font-size:19px;margin:10px}.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid #b6a893;border-radius:14px;overflow:hidden}.card{min-width:0;text-align:center;padding:10px 0}.card+.card{border-left:1px dashed #b6a89366}.portrait{position:relative;width:100%;aspect-ratio:1;cursor:pointer}.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.portrait .d4{visibility:hidden}body[data-state=d4] .portrait .d4{visibility:visible}body[data-state=d4] .portrait .listen{visibility:hidden}.caption{font-size:14px;padding:8px}.note{font-size:13px;padding:0 8px;min-height:32px}.canvas{background:#f4efe4}.dark .canvas{background:#282a30;color:#eee}.white .canvas{background:white}.checker .canvas{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}footer{padding:20px 32px;font-size:14px}dialog{border:0;border-radius:12px;max-width:90vw;background:#f4efe4}dialog img{display:block;max-height:80vh;max-width:80vw}dialog::backdrop{background:#0009}@media(max-width:800px){.row{grid-template-columns:repeat(3,minmax(0,1fr))}header{position:static;padding:16px}main{padding:8px}}
.portrait .talk_smile{visibility:hidden}body[data-state=talk_smile] .portrait .talk_smile{visibility:visible}body[data-state=talk_smile] .portrait:has(.talk_smile) .listen{visibility:hidden}
</style>
<body data-state="listen"><header><h1>开放日 · 两版角色对比</h1><p>12 张聆听基准 + 12 张 D4 差分 + 4 张微笑讲解。点击人物查看大图。</p><button id="listen" aria-pressed="true">聆听</button><button id="d4" aria-pressed="false">D4 反应</button><button id="talk_smile" aria-pressed="false">微笑讲解</button><button id="auto">自动交替</button><label>背景 <select id="bg"><option value="warm">暖米色</option><option value="white">白色</option><option value="dark">深灰</option><option value="checker">透明棋盘</option></select></label><span id="status">聆听</span></header><main id="content"></main><footer>原图为 1254 × 1254 透明 PNG。页面等比例显示原始画布；未自动修正人物大小或脚底高度。D4 不是全员说话：Rin、DeepSeek 保持闭嘴。<a href="../README.md">素材说明</a></footer><dialog id="zoom"><button id="close">关闭</button><img id="large" alt="角色原图"></dialog>
<script>
const people=[['rin','Rin','闭嘴 · 略惊讶旁听'],['gemini','Gemini','开口 · 惊讶调侃'],['claude','Claude','开口 · 尴尬苦笑'],['astra','Astra','开口 · 认真解释'],['deepseek','DeepSeek','闭嘴 · 会意苦笑'],['glm','GLM','开口 · 哭笑不得']];
let state='listen',timer=null;const content=document.querySelector('#content');
for(const [v,title] of [['compact','大头短身版'],['standard','修长 Q 版']]){const section=document.createElement('section');section.innerHTML='<h2>'+title+'</h2><div class="row canvas"></div>';const row=section.querySelector('.row');for(const [id,name,note]of people){const card=document.createElement('div');card.className='card';card.innerHTML='<div class="portrait" tabindex="0" role="button" aria-label="查看 '+name+' 大图"><img class="listen" alt="'+name+' 聆听" src="../sprites/'+v+'/'+id+'/listen.png"><img class="d4" alt="'+name+' D4" src="../sprites/'+v+'/'+id+'/d4.png"></div><div class="caption">'+name+'</div><div class="note">'+note+'</div>';if(['claude','astra'].includes(id)){const img=document.createElement('img');img.className='talk_smile';img.alt=name+' 微笑讲解';img.src='../sprites/'+v+'/'+id+'/talk_smile.png';card.querySelector('.portrait').append(img)}const open=()=>{const file=state==='talk_smile'&&!['claude','astra'].includes(id)?'listen':state;document.querySelector('#large').src='../sprites/'+v+'/'+id+'/'+file+'.png';document.querySelector('#zoom').showModal()};card.querySelector('.portrait').onclick=open;card.querySelector('.portrait').onkeydown=e=>{if(e.key==='Enter')open()};row.append(card)}content.append(section)}
function setState(s){state=s;document.body.dataset.state=s;for(const id of ['listen','d4','talk_smile'])document.getElementById(id).setAttribute('aria-pressed',id===s);document.getElementById('status').textContent=s==='listen'?'聆听':s==='d4'?'D4 反应':'微笑讲解（其他人聆听）'}
function stop(){clearInterval(timer);timer=null;document.querySelector('#auto').textContent='自动交替'}
for(const id of ['listen','d4','talk_smile'])document.getElementById(id).onclick=()=>{stop();setState(id)};
document.querySelector('#auto').onclick=()=>{if(timer){stop();return}timer=setInterval(()=>setState(state==='listen'?'d4':'listen'),900);document.querySelector('#auto').textContent='停止交替'};
document.querySelector('#bg').onchange=e=>document.body.className=e.target.value;
document.querySelector('#close').onclick=()=>document.querySelector('#zoom').close();
</script></body></html>
