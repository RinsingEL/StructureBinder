<script id="deck-data" type="application/json">{"title":"Geomantia · 一座城怎样长出来","subtitle":"Devlog #0 · 社团开放日 · 第二幕","scenes":[{"id":"terrain","title":"地形里，藏着城市的线索","short":"读地形","tag":"W / GIS / D3","summary":"先看山水，再决定在哪里生活。","focus":"地貌提供事实，城市设计决定怎样使用这片土地。","visual":"从地形底图开始，逐步显露水体、坡地与高地，再聚焦城市的局部扫描范围。当前是可编辑原理示意；后续可换成同一地点的 D3 地形图。","sourceLabel":"地貌原理示意 · 非真实扫描","beats":["一片等待被理解的土地","读取高度、水体与周围起伏","识别岸线、缓坡和高地","选到城市位置，再做 D3 局部复核"],"lines":[{"name":"Rinsing","action":"把短片停在城市远景，端起茶杯","text":"刚才大家看到的是城市已经长出来的样子。我想把时间往回拨一点：这片地方还只有山和水的时候，我们到底怎么决定，哪里放学院，哪里留给港口？两位，带大家倒着拆开看看吧。"},{"name":"Claude","action":"顺着地图指向海湾","text":"我会先看这片地方有什么性格。海湾适合迎接来客，高处适合让重要建筑被看见，坡地也可以成为城市的层次。先理解这些关系，再想人会怎样在这里生活，城市就有了属于这个地方的理由。"},{"name":"Astra","action":"轻轻点亮地形图层","text":"我先把高度、水体和起伏整理成可以查询的地貌资料。大范围粗看，到了城市位置再做局部复核。这里有条小规矩：没有采到的数据就留空，地图不会因为我们很想在这里建港口，就自觉长出一条海岸。"}],"transition":"地图有了，Rinsing 可以顺势问：那为什么这里最后是一座学院城？"},{"id":"life","title":"一座城里，要有人的一天","short":"安排生活","tag":"D4 · DESIGN","summary":"课堂、住处与广场，因为生活而相连。","focus":"先展开功能和公共空间，再挑选建筑；核心、必需配套和可选填充由本次设计决定。","visual":"展示已有星穹学院工作台总览，随对话依次强调主院、生活片区和公共广场。保留原截图，不把手工构图对照方案说成自动生成验收成果。","sourceLabel":"2026-10-12 星穹学院 · 离线构图示范","beats":["先想象谁会住在这里","教学与研究，有各自的活动空间","居住与公共空间，承接一天的生活","用主轴与广场，把片区组织成整体"],"lines":[{"name":"Rinsing","action":"指着广场旁边的小楼","text":"我其实很怕一种结果：学院有了，宿舍也有了，但走进去还是觉得它们只是挨着摆在那里。我想要的是，玩家下课以后会知道去哪儿吃饭、去哪儿闲逛，甚至愿意在某个小院里多待一会儿。"},{"name":"Claude","action":"把视线从主院移向广场","text":"所以我会先安排人的一天。教学和研究需要安静的空间，食堂和广场可以承接大家聚在一起的时候，住处则要有回家的感觉。主轴、庭院和街坊，把这些活动连成一座能被理解、也愿意被探索的城。"},{"name":"Astra","action":"翻开素材目录，又轻轻合上","text":"这些选择会落成具体的功能区：核心是谁，哪些配套必须留下，哪些可以选填。素材的用途、尺寸和入口都有依据。名字叫魔法塔，也不会自动获得传送功能；这个需求我看见了，但还没有批准它偷偷上线。"}],"transition":"看到城市构图后，把镜头拉成平面，解释设计如何落到具体坐标。"},{"id":"coordinates","title":"坐标落下，组团展开","short":"展开组团","tag":"D4 · COMPILE / PREVIEW","summary":"设计者定位组团，程序展开每个成员。","focus":"普通根组用 anchorBlock 定位，嵌套阵列由父布局组织；修改后看当前版本预览，核对实际保留内容。","visual":"一枚根锚点出现后，院落与街坊逐步展开，再点亮真实占地与入口方向，最后出现预览复核。所有坐标和尺寸均为说明用示意。","sourceLabel":"D4 组团展开示意 · 非编译结果","beats":["设计一个明确的组团位置","围院与街坊，展开各自的成员","按真实占地检查边界、间距与碰撞","看当前版本预览，再定向修订"],"lines":[{"name":"Rinsing","action":"把地图拉近，笑着看向 Astra","text":"这里我得替观众问一句：这么多楼的位置，难道真的要让模型一栋一栋算吗？以前聊坐标的时候，我自己都快绕晕了。现在我想挪一个院子，是不是终于不用把整座城从头再来一遍了？"},{"name":"Claude","action":"在平面图上圈出一座院落","text":"我更关心这个院子面对什么，哪一边需要留白，以及它和隔壁街坊怎样相接。先把组团的关系想清楚，再选择围院、网格或嵌套组合。这样调整的始终是一段空间关系，设计意图也比较容易保留下来。"},{"name":"Astra","action":"落下一枚坐标标记","text":"普通根组用世界坐标确定位置，里面的成员由阵列展开，程序再核对占地和碰撞。满意的区可以保留，问题区单独修改。每张预览还绑定草稿版本，所以想拿上一版漂亮截图替这一版交作业，会被我当场抓住。"}],"transition":"平面安排妥当，再把镜头转到侧面，看看高差如何处理。"},{"id":"terraces","title":"街区共台，道路接上高差","short":"接好高差","tag":"SHARED TERRACE / ROAD","summary":"共同的地面，让建筑真正连成街区。","focus":"区内随核心取高，区间保留层次；道路要衔接实际入口和站立面，连接空间不足时必须报告。","visual":"用剖面动效先显示自然坡面，再显示两片随核心取高的共享台地，最后补道路与入口。可切换“连接空间不足”，示意为何不能把断路标成成功。","sourceLabel":"共享台地与道路剖面示意 · 高差不按比例","beats":["自然坡面上，建筑各有落脚位置","核心附近的地形，提供本区高程依据","同一片台地，承接建筑、铺地和庭院","道路连接两端，也要接好真实入口"],"lines":[{"name":"Rinsing","action":"比画了一下上下两层地面","text":"这个地方我特别想给大家看。我们想保留山城那种一层一层往上走的感觉，又不想每栋楼都站在自己的小土墩上。最好站在广场里，就能自然走进旁边的楼，再顺着路去高处的主院。"},{"name":"Claude","action":"沿着剖面慢慢指向主院","text":"共享台地让一个街区拥有共同的地面，建筑、庭院和铺地因此能连在一起。不同片区又可以顺着地势保留高低。人从低处走向高处，空间逐渐展开，这种走进去才感受到的层次，是我很在意的部分。"},{"name":"Astra","action":"把手指停在两段道路的接头","text":"我负责让这段路接到人物脚底真正站立的位置，入口、交叉口和道路全宽都得照顾。高差太大、距离又太短，就会报告需要调整。兜底可以写很多层，但不能最后一层写着：相信玩家会飞。"}],"transition":"沿着道路走出城区，画面从密集街区放宽到大片田林。"},{"id":"rural","title":"大片田林里，散着几户人家","short":"田林拼图","tag":"RURAL MOSAIC / SCATTER","summary":"田野成为主体，农舍保留自己的小组合。","focus":"田林按地形代价分块生长；完整农舍组合稀疏散布，局部小路与接入全城分别检查。","visual":"田林色块按步骤生长并留下田埂，随后出现谷仓与农舍的小组合，最后接上乡间小路。画面是机制示意，正式视觉效果等实机关键帧替换。","sourceLabel":"乡野机制示意 · 实机视觉待验收","beats":["为田林留出完整的空间","沿地形分块生长，块间留下田埂","少量完整农舍组，稀疏落位","小路接到入口，再明确连接城区"],"lines":[{"name":"Rinsing","action":"把镜头从城里拉向外围","text":"我之前脑子里的乡野，是大片麦田和树林，中间偶尔碰到风车、谷仓和几户人家。后来发现，几栋房子旁边配几块小菜地，离这个感觉还是很远。这里我想把画面放慢一点，让大家看它怎么长出来。"},{"name":"Claude","action":"看着田块逐渐铺开","text":"乡野需要让土地占据画面的大部分。田林顺着地势形成不规则的块，农舍在其中稀疏成组，走过一段田埂才遇到下一户人家。城内外的疏密变化，也会让玩家真正感觉到自己已经走出了城市。"},{"name":"Astra","action":"给农舍与道路各点一个标记","text":"田林拼图按坡度、高差和水体等条件生长，农舍则以完整的小组合散布。它们的数量和田地面积可以分开决定。还有一句熟悉的提醒：农舍之间有路，不代表已经通到城里。最后那一截，可别又交给想象力。"}],"transition":"从田野移向海边，继续讲另一种由地形决定形状的布局。"},{"id":"shore","title":"岸线弯到哪里，港区就跟到哪里","short":"沿线排布","tag":"TERRAIN LINE","summary":"选一条地形线，让建筑与岸边产生关系。","focus":"从冻结 D3 采样提取岸线、等高线与崖边，设计选择线段，程序处理间距、退距和朝向。","visual":"先显示岸线，再依次显示采样出的线段、朝水的建筑和陆侧后排。保留一个断开的线段，说明程序不会跨未知地形补线；当前绘制为原理示意。","sourceLabel":"沿岸排布原理示意 · 非真实港区","beats":["先有真实地形，再选择沿线布局","从 D3 采样中提取可选线段","成员沿线排列，正面朝水或低地","后排退向陆侧，断开的线段分别处理"],"lines":[{"name":"Rinsing","action":"用手沿海湾画了一道弧线","text":"港口也是我一直惦记的画面。岸线明明是弯的，如果建筑还只会排一条笔直的队，看着就不太像长在这里。我希望货栈、码头，甚至峡谷边的起重机，都能和脚下这条边缘真正发生关系。"},{"name":"Claude","action":"指向最靠水的那一排","text":"沿线布局把岸边变成了空间组织的依据。第一排面对水面，后排向陆地展开，建筑随着地形转折。相似的思路也能用于坡地和崖边，城市的轮廓就会带上这个地方自己的形状。"},{"name":"Astra","action":"把一段断线留在画面上","text":"程序从有效采样里提取地形线，设计者选用哪一段，再交给我处理间距、退距和朝向。这里的断线会保留，未知地形不能脑补。目前沿线小路仍会自动规划，起重机到底能贴多近，也得看真实素材的支撑范围。"}],"transition":"把视角拉回工作台，说明这些想法如何反复查看并进入游戏。"},{"id":"workbench","title":"工作台里推敲，游戏里相见","short":"看见与落地","tag":"STUDIO / WORKBENCH / WORLDGEN","summary":"每一次预览，都让下一次讨论更具体。","focus":"真实 NBT 与生产 Java 逻辑支持离线推敲；正式生成还需预留、模板锁定、区块施工和现场核验。","visual":"展示已有工作台工程预览，再依次强调素材、预览修订与正式生成。录制时可换成本次实机关键帧，切换后来源标签改为用户提供的画面。","sourceLabel":"2026-10-12 工作台工程预览 · 未写入游戏存档","beats":["真实素材，先在工作台里看清楚","反复查看组团、道路与台地","正式方案进入预留、锁定与区块施工","最终的城市，还要走进去看"],"lines":[{"name":"Rinsing","action":"把工作台画面停住，转向大家","text":"以前聊这些东西，我常常得在脑子里拼很久。现在我们终于能指着同一个画面说，这里太空，那里太挤，这段路是不是接不上。这种能一起看、一起改的感觉，对我来说也是这次特别值得庆祝的地方。"},{"name":"Claude","action":"点头，把修改意见放在画面旁","text":"工作台让设计讨论有了共同的参照。我们可以先看空间关系和建筑尺度，再观察台地、道路怎样衔接。每一轮修改都能留下具体的变化，好的想法也就更容易被大家理解，慢慢成为共同认可的城市。"},{"name":"Astra","action":"合上记录本，把茶杯推近一点","text":"这里使用真实建筑素材，也复用了正式 Java 的不少施工逻辑。进入游戏还要经过预留、模板锁定和区块落地，最后亲自走一走。预览通过和游戏验收我会分开记，不过今天这杯庆功茶，已经可以正常提交了。"}],"transition":"Rinsing 接回主持：为了走到今天，我们其实绕了不少弯路。转入下一幕的项目历程。"}]}</script>

<script>
const deck=JSON.parse(document.querySelector('#deck-data').textContent);

const scenes=deck.scenes;let scene=0,beat=0,timer=null,problem=false;
const custom=deck.customImages||{};let toastTimer;

const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const group=(b,content)=>`<g data-beat="${b}">${content}</g>`;
const grid='<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" opacity=".07"/></pattern></defs><rect width="800" height="500" fill="url(#grid)"/>';
const svg=inner=>`<svg viewBox="0 0 800 500" role="img" aria-label="${escape(scenes[scene].visual)}">${grid}${inner}</svg>`;
const footprint=(x,y,w=44,h=32,color='#97b78a')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${color}" stroke="#41604a" stroke-width="2"/><path d="M${x+w/2-5},${y+h}h10" stroke="#f6efd6" stroke-width="4"/>`;

function life(){return `<div class="image-plot"><img src="${pictures.academy}" alt="星穹学院离线工作台构图示范，主院、广场、生活区沿主轴组织"><div class="image-overlay"><span data-beat="1">主院与教学</span><span data-beat="2">食堂与住处</span><span data-beat="3">广场串起生活</span></div><div class="photo-caption">已有工作台画面 · 手工构图对照方案</div></div>`}
function coordinates(){return svg(`<rect x="45" y="40" width="710" height="400" fill="#e7e8da" stroke="#b6c2a7"/>${group(0,'<path d="M390 220H430M410 200V240" stroke="#b16c44" stroke-width="2"/><circle cx="410" cy="220" r="8" fill="#b16c44"/><path d="M410 220V45H550" fill="none" stroke="#b16c44" stroke-dasharray="4 4"/><text x="555" y="48">根组合 · anchorBlock</text><text x="350" y="275" class="tiny">世界平面位置</text>')}${group(1,footprint(325,75,170,44,'#b7a5b9')+footprint(277,145,44,145,'#b7a5b9')+footprint(499,145,44,145,'#b7a5b9')+footprint(98,270,60,40)+footprint(185,270,60,40)+footprint(98,345,60,40)+footprint(185,345,60,40)+footprint(600,260,50,36,'#d7b88a')+footprint(675,260,50,36,'#d7b88a')+footprint(600,335,50,36,'#d7b88a')+footprint(675,335,50,36,'#d7b88a')+'<text x="352" y="330">主庭院</text><text x="120" y="240">书院街坊</text><text x="610" y="230">生活组团</text>')}${group(2,'<path d="M78 255H260V402H78ZM265 60H555V307H265ZM584 248H740V391H584Z" fill="none" stroke="#678360" stroke-width="2" stroke-dasharray="6 5"/><path d="M410 305V355H565M410 355H277" fill="none" stroke="#c8ac7e" stroke-width="12"/><path d="M410 135V164M487 215H465M333 215H355" stroke="#8d693e" stroke-width="4"/>')}${group(3,'<path d="M560 72l10 10 20-24" stroke="#678360" stroke-width="4" fill="none"/><rect x="326" y="379" width="200" height="43" fill="#d3dfc4"/><text x="347" y="407">预览 → 修订 → 再编译</text>')}<text x="46" y="478" class="tiny">建筑占地、边界与坐标仅作机制说明；正式结果由编译反馈确认</text>`)}
function terraces(){return svg(`<path d="M40 375L115 345 210 360 290 300 390 315 450 265 530 275 585 230 675 245 755 215V445H40Z" fill="#c7ccb3"/><path d="M40 375L115 345 210 360 290 300 390 315 450 265 530 275 585 230 675 245 755 215" fill="none" stroke="#859776" stroke-width="3"/><text x="70" y="430" class="tiny">原有坡面</text>${group(0,'<rect x="150" y="275" width="62" height="65" fill="#a69bb0"/><path d="M142 275L181 240 220 275Z" fill="#6e6478"/><rect x="594" y="143" width="65" height="90" fill="#a69bb0"/><path d="M585 143L626 100 669 143Z" fill="#6e6478"/>')}${group(1,'<path d="M80 345H320M500 240H740" stroke="#b48650" stroke-width="3" stroke-dasharray="7 5"/><circle cx="180" cy="345" r="6" fill="#b48650"/><circle cx="625" cy="240" r="6" fill="#b48650"/><text x="110" y="210">生活区核心</text><text x="570" y="70">主院核心</text>')}${group(2,'<path d="M75 345H320V380L75 397Z" fill="#aab990"/><path d="M495 240H740V278L495 308Z" fill="#aab990"/><path d="M75 342H320M495 237H740" stroke="#536b48" stroke-width="8"/><rect x="245" y="292" width="44" height="46" fill="#d5c9af"/><rect x="680" y="190" width="40" height="43" fill="#d5c9af"/><text x="102" y="460">区内共台</text><text x="553" y="460">区间保留层次</text>')}${group(3,'<g class="road-valid"><path class="trace" d="M212 339H320V327H340V315H360V303H380V291H400V279H420V267H440V255H460V243H495V234H594" fill="none" stroke="#b9824d" stroke-width="8" stroke-linejoin="round"/><text x="300" y="180" class="large">道路接好两端</text><path d="M408 197V246" stroke="#b9824d" stroke-width="2"/></g><g class="road-gap"><path d="M212 339H345M470 234H594" stroke="#b9824d" stroke-width="8"/><path d="M345 339L470 234" stroke="#b65d44" stroke-width="3" stroke-dasharray="7 7"/><text x="286" y="168" fill="#9c4a35">连接空间不足</text><text x="270" y="199" class="tiny">需要调整方案，不能把缺口标成接通</text></g>')}<text x="40" y="492" class="tiny">侧面原理示意 · 实际还需校验入口站立面、道路全宽与交叉口</text>`)}
function rural(){return svg(`<path d="M35 50H765V450H35Z" fill="#426249"/><path d="M65 450C110 365 55 315 92 230S155 105 125 50" fill="none" stroke="#74afb1" stroke-width="25"/>${group(0,'<path d="M170 65L350 55 390 170 295 240 150 200Z" fill="#b2b765"/><path d="M390 55L580 65 570 185 410 172Z" fill="#7c9d64"/>')}${group(1,'<path d="M600 65L745 75 750 230 590 215 584 185Z" fill="#c6b76e"/><path d="M145 215L295 253 315 365 130 390 115 310Z" fill="#cfbd70"/><path d="M310 245L400 187 565 199 525 305 348 330Z" fill="#93ad68"/><path d="M346 346L530 321 580 430 325 433Z" fill="#b6ab61"/><path d="M548 310L592 234 748 250 735 435 597 433Z" fill="#7c9c62"/><path d="M170 90L305 82M162 111L319 102M157 133L327 123M152 155L333 145M150 177L323 167M150 285L280 314M144 307L283 337M138 329L286 358M622 103L721 109M617 124L723 130M613 145L726 151M610 166L729 172M607 187L733 193" fill="none" stroke="#e2d89c" stroke-width="2" opacity=".45"/>')}${group(2,farm(251,115)+farm(570,300)+farm(397,356)+'<text x="400" y="116" class="paper-label">林块</text><text x="160" y="365" class="paper-label">田块</text>')}${group(3,'<path class="trace" d="M285 181C325 213 342 270 394 292S566 275 596 365M432 422C430 360 418 322 394 292M394 292C443 239 488 212 510 50" fill="none" stroke="#ebd3a2" stroke-width="6"/><path d="M503 62L510 49 516 64" fill="none" stroke="#ebd3a2" stroke-width="3"/><text x="550" y="35" class="paper-label">明确接入城区</text>')}<text x="40" y="487" class="tiny">田林面积与农舍数量分别设计；示意不代表已生成画面</text>`)}
function shore(){return svg(`<path d="M35 45H765V450H35Z" fill="#4f888c"/><path d="M35 45H765V105L695 105 695 170 600 170 600 235 510 235 510 300 400 300 400 355 290 355 290 395 160 395 160 450H35Z" fill="#8ba078"/>${group(0,'<text x="70" y="100" class="paper-label large">陆地</text><text x="610" y="382" class="paper-label large">海湾</text>')}${group(1,'<path class="trace" d="M180 395H290V355H400V300H510V235H600V170H695V105H745" fill="none" stroke="#ead99c" stroke-width="4" stroke-dasharray="8 6"/><circle cx="290" cy="355" r="5" fill="#f0e7bc"/><circle cx="510" cy="235" r="5" fill="#f0e7bc"/><text x="290" y="442" class="paper-label">选取 D3 地形线</text>')}${group(2,footprint(205,348,55,30,'#e4d0a7')+footprint(320,308,55,30,'#e4d0a7')+footprint(430,252,55,30,'#e4d0a7')+footprint(525,186,55,30,'#e4d0a7')+footprint(620,121,55,30,'#e4d0a7')+'<path d="M232 383V410m-5-6 5 6 5-6M347 344V374m-5-6 5 6 5-6M457 288V318m-5-6 5 6 5-6M552 222V252m-5-6 5 6 5-6M647 157V187m-5-6 5 6 5-6" stroke="#f4ecc7" stroke-width="2" fill="none"/>')}${group(3,footprint(210,278,45,32,'#c2c6a3')+footprint(330,238,45,32,'#c2c6a3')+footprint(440,182,45,32,'#c2c6a3')+footprint(535,116,45,32,'#c2c6a3')+'<text x="240" y="135" class="paper-label">后排向陆侧退让</text><path d="M330 150L347 220" fill="none" stroke="#f4ecc7" stroke-width="2"/><path d="M48 453H120" fill="none" stroke="#ead99c" stroke-width="4" stroke-dasharray="8 6"/><text x="45" y="483" class="tiny">断开的线段分别选择</text>')}`)}
function workbench(){return `<div class="image-plot workbench-photo"><img src="${pictures.workbench}" alt="已有建筑工作台工程预览，可查看分区、阵列和核心台地"><div class="photo-caption">已有工作台工程预览 · 此图不是游戏内截图</div><div class="flow"><span data-beat="1">真实 NBT 素材</span><span data-beat="2">编译与预览修订</span><span data-beat="3">区块落地 · 现场核验</span></div></div>`}
const visuals={terrain,life,coordinates,terraces,rural,shore,workbench};
function markup(index){const s=scenes[index];return `<div class="slide-top"><span>GEOMANTIA / DEVLOG #0</span><span>一座城怎样长出来 · ${String(index+1).padStart(2,'0')}</span></div><div class="topline"></div><div class="copy"><p class="eyebrow">${s.tag}</p><h1>${s.title}</h1><p class="summary">${s.summary}</p><div class="beat-list">${s.beats.map((b,i)=>`<p class="beat-item" data-step="${i}">${b}</p>`).join('')}</div></div><div class="plot">${custom[s.id]?`<div class="replacement"><img src="${custom[s.id]}" alt="用户为本段替换的画面"></div>`:visuals[s.id]()}</div><div class="scene-bottom"><p class="current-caption">${s.beats[beat]}</p><div class="source">${custom[s.id]?'用户替换的画面 · 请录制前核对来源':s.sourceLabel}</div></div><div class="sequence"></div>`}
function size(){el('canvas').style.setProperty('--scale',document.querySelector('.stage').clientWidth/1280)}
function render(){const s=scenes[scene];el('canvas').className='canvas'+(['terrain','rural','shore'].includes(s.id)?' dark':'');el('canvas').innerHTML=markup(scene);el('sceneNav').innerHTML=scenes.map((s,i)=>`<button data-scene="${i}" aria-label="第 ${i+1} 段：${s.short}" aria-pressed="${i===scene}">${String(i+1).padStart(2,'0')} ${s.short}</button>`).join('');el('notes').innerHTML=`<div class="note-heading"><h2>${s.title}</h2><span>候选串词 · 由本人润色与现场发挥</span></div><div class="meta"><p><b>画面建议</b>${s.visual}</p><p><b>核心看点</b>${s.focus}</p></div><div class="dialogue">${s.lines.map(l=>`<article class="speaker"><h3>【${l.name}｜${l.action}】</h3><p>「${l.text}」</p></article>`).join('')}</div><p class="transition">接话位置：${s.transition}</p>`;el('problem').hidden=s.id!=='terraces'||!!custom[s.id];el('problem').setAttribute('aria-pressed',String(problem));el('resetImage').hidden=!custom[s.id];el('canvas').querySelectorAll('svg [data-beat]').forEach(g=>[...g.children].forEach((child,i)=>child.style.setProperty('--stagger',Math.min(i*85,600)+'ms')));size();requestAnimationFrame(()=>requestAnimationFrame(updateBeat));history.replaceState(null,'','#'+(scene+1));}
function updateBeat(){const s=scenes[scene];el('canvas').querySelectorAll('[data-beat]').forEach(n=>(n.classList.toggle('shown',+n.dataset.beat<=beat),n.setAttribute('aria-hidden',String(+n.dataset.beat>beat))));el('canvas').querySelectorAll('[data-step]').forEach(n=>{n.classList.toggle('visible',+n.dataset.step<=beat);n.classList.toggle('current',+n.dataset.step===beat)});el('canvas').classList.toggle('problem',problem);el('canvas').querySelector('.road-valid')?.setAttribute('aria-hidden',String(problem));el('canvas').querySelector('.road-gap')?.setAttribute('aria-hidden',String(!problem));el('canvas').querySelector('.current-caption').textContent=problem&&s.id==='terraces'&&beat===3?'演示情景：距离不足时，保留问题并调整连接空间':s.beats[beat];el('canvas').querySelector('.sequence').style.width=((scene+(beat+1)/4)/scenes.length*100)+'%';el('counter').textContent=`${scene+1}/${scenes.length} · ${beat+1}/4`;el('previous').disabled=scene===0&&beat===0;el('next').disabled=scene===scenes.length-1&&beat===3;el('next').textContent=beat<3?'下一步 →':scene<scenes.length-1?'下一段 →':'本幕结束';}
function stop(){clearInterval(timer);timer=null;el('play').textContent='播放本段';el('play').setAttribute('aria-pressed','false')}
function goto(index){stop();scene=Math.max(0,Math.min(index,scenes.length-1));beat=0;problem=false;render()}
function next(){stop();if(beat<3){beat++;updateBeat()}else if(scene<scenes.length-1)goto(scene+1)}
function previous(){stop();if(beat>0){beat--;updateBeat()}else if(scene>0){goto(scene-1);beat=3;updateBeat()}}
function play(){if(timer){stop();return}if(beat===3){beat=0;updateBeat()}el('play').textContent='暂停';el('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(beat<3){beat++;updateBeat()}if(beat===3)stop()},2600)}
function toggleNotes(){el('notes').hidden=!el('notes').hidden;el('notesToggle').textContent=el('notes').hidden?'显示串词 N':'收起串词 N';el('notesToggle').setAttribute('aria-pressed',String(!el('notes').hidden))}
function present(force){document.body.classList.toggle('presenting',force===undefined?!document.body.classList.contains('presenting'):force);requestAnimationFrame(size)}
function toast(msg){clearTimeout(toastTimer);el('toast').textContent=msg;el('toast').classList.add('show');toastTimer=setTimeout(()=>el('toast').classList.remove('show'),3500)}
function download(name,body,type){const blob=new Blob([body],{type});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),2000)}
function manuscript(){return `# ${deck.title}\n\n第二幕动态演示与候选串词，2026-10-24。\n\n每段有四个演示状态，按现场聊天节奏展开；串词是给三位的草稿，不是已发生的对话。Rinsing 可只保留提问方向，用自己的话引出画面。\n\n`+scenes.map((s,i)=>`## ${s.title}\n\n画面建议：${s.visual}\n\n核心看点：${s.focus}\n\n动效节奏：${s.beats.join(' → ')}。\n\n${s.lines.map(l=>`【${l.name}｜${l.action}】\n「${l.text}」`).join('\n\n')}\n\n接话位置：${s.transition}\n\n画面口径：${s.sourceLabel}。\n`).join('\n')}
el('next').onclick=next;el('previous').onclick=previous;el('play').onclick=play;el('notesToggle').onclick=toggleNotes;el('present').onclick=()=>present();el('leave').onclick=()=>present(false);el('sceneNav').onclick=e=>{const b=e.target.closest('[data-scene]');if(b)goto(+b.dataset.scene)};
el('problem').onclick=()=>{problem=!problem;beat=3;el('problem').setAttribute('aria-pressed',String(problem));updateBeat()};el('upload').onclick=()=>el('file').click();
el('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('请选择 PNG、JPG 或 WebP 图片');e.target.value='';return}if(file.size>12*1024*1024){toast('请选用 12 MB 以内的图片');e.target.value='';return}const target=scenes[scene].id;const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)}).catch(()=>null);if(!data){toast('图片读取失败，请重试');return}try{const img=new Image();img.src=data;await img.decode()}catch{toast('图片无法解析，请换一张');e.target.value='';return}custom[target]=data;if(scenes[scene].id===target)render();toast('已替换本页画面；点击“保存演示”即可把图片一起带走');e.target.value=''};
el('resetImage').onclick=()=>{delete custom[scenes[scene].id];render()};el('exportScript').onclick=()=>download('第二幕_分页与串词.md',manuscript(),'text/markdown;charset=utf-8');
el('exportHtml').onclick=()=>{stop();const copy=document.documentElement.cloneNode(true);copy.querySelector('#deck-data').textContent=JSON.stringify({...deck,customImages:custom}).replace(/</g,'\\u003c');copy.querySelector('body').classList.remove('presenting');copy.querySelector('#printDeck').innerHTML='';download('Geomantia_第二幕演示.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('已保存完整演示，包含当前替换的图片')};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const actions={ArrowRight:next,ArrowLeft:previous,ArrowDown:()=>goto(scene+1),ArrowUp:()=>goto(scene-1),' ':play,n:toggleNotes,N:toggleNotes,f:()=>present(),F:()=>present(),Escape:()=>{stop();present(false)}};if(actions[e.key]){e.preventDefault();actions[e.key]()}else if(/^[1-7]$/.test(e.key)){goto(+e.key-1)}});
window.addEventListener('beforeprint',()=>{stop();const old=scene,oldBeat=beat;el('printDeck').innerHTML=scenes.map((s,i)=>{scene=i;beat=3;return `<div class="print-page"><div class="canvas ${['terrain','rural','shore'].includes(s.id)?'dark':''}">${markup(i)}</div></div>`}).join('');scene=old;beat=oldBeat;el('printDeck').querySelectorAll('[data-beat]').forEach(n=>n.classList.add('shown'));el('printDeck').querySelectorAll('[data-step]').forEach(n=>n.classList.add('visible'))});
new ResizeObserver(size).observe(document.querySelector('.stage'));document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});const start=Number(location.hash.slice(1));if(Number.isInteger(start)&&start>=1&&start<=scenes.length)scene=start-1;render();
</script>
</body></html>
