function workbench(){return `<div class="image-plot workbench-photo"><img src="${pictures.workbench}" alt="已有建筑工作台工程预览，可查看分区、阵列和核心台地"><div class="photo-caption">已有工作台工程预览 · 此图不是游戏内截图</div><div class="flow"><span data-beat="1">真实 NBT 素材</span><span data-beat="2">编译与预览修订</span><span data-beat="3">区块落地 · 现场核验</span></div></div>`}
__EXTRA_VISUALS__
const visuals={terrain,life,coordinates,terraces,rural,shore,workbench,journey,culture,expansion,cityRoles,delivery,choice,d4Replay};
function markup(index){const s=scenes[index];return `<div class="slide-top"><span>GEOMANTIA / DEVLOG #0</span><span>山水间的异世界 · ${String(index+1).padStart(2,'0')}</span></div><div class="topline"></div><div class="copy"><p class="eyebrow">${s.tag}</p><h1>${s.title}</h1><p class="summary">${s.summary}</p><div class="beat-list">${s.beats.map((b,i)=>`<p class="beat-item" data-step="${i}">${b}</p>`).join('')}</div></div><div class="plot">${custom[s.id]?`<div class="replacement"><img src="${custom[s.id]}" alt="用户为本段替换的画面"></div>`:frameMarkup(s)}</div><div class="scene-bottom"><p class="current-caption">${s.beats[beat]}</p><div class="source">${custom[s.id]?'用户替换的画面 · 请录制前核对来源':s.sourceLabel}</div></div><div class="sequence"></div>`}
function size(){el('canvas').style.setProperty('--scale',document.querySelector('.stage').clientWidth/1280)}
function render(){const s=scenes[scene];el('canvas').className='canvas'+(s.id==='landscape'?' dark':'')+(s.id==='d4Replay'?' replay':'');el('canvas').innerHTML=markup(scene);el('sceneNav').innerHTML=scenes.map((s,i)=>`<button data-scene="${i}" aria-label="第 ${i+1} 段：${s.short}" aria-pressed="${i===scene}">${String(i+1).padStart(2,'0')} ${s.short}</button>`).join('');el('notes').innerHTML=`<div class="note-heading"><h2>${s.title}</h2><span>候选串词 · 由本人润色与现场发挥</span></div><div class="meta"><p><b>画面建议</b>${s.visual}</p><p><b>核心看点</b>${s.focus}</p></div><div class="dialogue">${s.lines.map(l=>`<article class="speaker"><h3>【${l.name}｜${l.action}】</h3><p>「${l.text}」</p></article>`).join('')}</div><p class="transition">接话位置：${s.transition}</p>`;el('problem').hidden=s.id!=='terraces'||!!custom[s.id];el('problem').setAttribute('aria-pressed',String(problem));el('resetImage').hidden=!custom[s.id];el('canvas').querySelectorAll('svg [data-beat]').forEach(g=>[...g.children].forEach((child,i)=>child.style.setProperty('--stagger',Math.min(i*85,600)+'ms')));size();updateBeat();history.replaceState(null,'','#'+(scene+1));}
function updateBeat(){const s=scenes[scene];el('canvas').querySelectorAll('[data-frame]').forEach(n=>{const active=+n.dataset.frame===beat;n.classList.toggle('active',active);n.setAttribute('aria-hidden',String(!active))});el('canvas').querySelectorAll('[data-beat]').forEach(n=>(n.classList.toggle('shown',+n.dataset.beat<=Number(n.closest("[data-frame]")?.dataset.reveal??beat)),n.setAttribute('aria-hidden',String(+n.dataset.beat>Number(n.closest("[data-frame]")?.dataset.reveal??beat)))));el('canvas').querySelectorAll('[data-step]').forEach(n=>{n.classList.toggle('visible',+n.dataset.step<=beat);n.classList.toggle('current',+n.dataset.step===beat)});el('canvas').classList.toggle('problem',problem);el('canvas').querySelector('.road-valid')?.setAttribute('aria-hidden',String(problem));el('canvas').querySelector('.road-gap')?.setAttribute('aria-hidden',String(!problem));el('canvas').querySelector('.source').textContent=custom[s.id]?'用户替换的画面 · 请核对来源':s.frames[beat].note;el('canvas').querySelector('.current-caption').textContent=problem&&s.id==='terraces'&&beat===3?'演示情景：距离不足时，保留问题并调整连接空间':s.beats[beat];el('canvas').querySelector('.sequence').style.width=((scene+(beat+1)/s.beats.length)/scenes.length*100)+'%';el('counter').textContent=`${scene+1}/${scenes.length} · ${beat+1}/${s.beats.length}`;el('previous').disabled=scene===0&&beat===0;el('next').disabled=scene===scenes.length-1&&beat===s.beats.length-1;el('next').textContent=beat<s.beats.length-1?'下一步 →':scene<scenes.length-1?'下一段 →':'本幕结束';}
function stop(){clearInterval(timer);timer=null;el('play').textContent='播放本段';el('play').setAttribute('aria-pressed','false')}
function goto(index){stop();scene=Math.max(0,Math.min(index,scenes.length-1));beat=0;problem=false;render()}
function next(){stop();if(beat<scenes[scene].beats.length-1){beat++;updateBeat()}else if(scene<scenes.length-1)goto(scene+1)}
function previous(){stop();if(beat>0){beat--;updateBeat()}else if(scene>0){goto(scene-1);beat=scenes[scene].beats.length-1;updateBeat()}}
function play(){if(timer){stop();return}if(beat===scenes[scene].beats.length-1){beat=0;updateBeat()}el('play').textContent='暂停';el('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(beat<scenes[scene].beats.length-1){beat++;updateBeat()}if(beat===scenes[scene].beats.length-1)stop()},2600)}
function toggleNotes(){el('notes').hidden=!el('notes').hidden;el('notesToggle').textContent=el('notes').hidden?'显示串词 N':'收起串词 N';el('notesToggle').setAttribute('aria-pressed',String(!el('notes').hidden))}
function present(force){document.body.classList.toggle('presenting',force===undefined?!document.body.classList.contains('presenting'):force);requestAnimationFrame(size)}
function toast(msg){clearTimeout(toastTimer);el('toast').textContent=msg;el('toast').classList.add('show');toastTimer=setTimeout(()=>el('toast').classList.remove('show'),3500)}
function download(name,body,type){const blob=new Blob([body],{type});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),2000)}
function manuscript(){return `# ${deck.title}\n\n第二幕动态演示与候选串词，2026-10-24。\n\n普通段落四步，D4 调用回放九步，按现场聊天节奏展开；串词是给三位的草稿，不是已发生的对话。Rinsing 可用自己的话讲动机、玩家体验与转场。历史回顾留在第三幕。\n\n`+scenes.map((s,i)=>`## ${s.title}\n\n画面建议：${s.visual}\n\n核心看点：${s.focus}\n\n动效节奏：${s.beats.join(' → ')}。\n\n${s.lines.map(l=>`【${l.name}｜${l.action}】\n「${l.text}」`).join('\n\n')}\n\n接话位置：${s.transition}\n\n画面口径：${s.sourceLabel}。\n`).join('\n')}
el('motion').onclick=()=>{const reduced=document.body.classList.toggle('reduce-motion');el('motion').setAttribute('aria-pressed',String(reduced));el('motion').textContent=reduced?'恢复动效':'减少动效'};el('next').onclick=next;el('previous').onclick=previous;el('play').onclick=play;el('notesToggle').onclick=toggleNotes;el('present').onclick=()=>present();el('leave').onclick=()=>present(false);el('sceneNav').onclick=e=>{const b=e.target.closest('[data-scene]');if(b)goto(+b.dataset.scene)};
el('problem').onclick=()=>{problem=!problem;beat=3;el('problem').setAttribute('aria-pressed',String(problem));updateBeat()};el('upload').onclick=()=>el('file').click();
el('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('请选择 PNG、JPG 或 WebP 图片');e.target.value='';return}if(file.size>12*1024*1024){toast('请选用 12 MB 以内的图片');e.target.value='';return}const target=scenes[scene].id;const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)}).catch(()=>null);if(!data){toast('图片读取失败，请重试');return}try{const img=new Image();img.src=data;await img.decode()}catch{toast('图片无法解析，请换一张');e.target.value='';return}custom[target]=data;if(scenes[scene].id===target)render();toast('已替换本页画面；点击“保存演示”即可把图片一起带走');e.target.value=''};
el('resetImage').onclick=()=>{delete custom[scenes[scene].id];render()};el('exportScript').onclick=()=>download('第二幕_分页与串词.md',manuscript(),'text/markdown;charset=utf-8');
el('exportHtml').onclick=()=>{stop();const copy=document.documentElement.cloneNode(true);copy.querySelector('#deck-data').textContent=JSON.stringify({...deck,customImages:custom}).replace(/</g,'\\u003c');copy.querySelector('body').classList.remove('presenting');copy.querySelector('#printDeck').innerHTML='';download('Geomantia_第二幕演示.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('已保存完整演示，包含当前替换的图片')};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const actions={ArrowRight:next,ArrowLeft:previous,ArrowDown:()=>goto(scene+1),ArrowUp:()=>goto(scene-1),' ':play,n:toggleNotes,N:toggleNotes,f:()=>present(),F:()=>present(),Escape:()=>{stop();present(false)}};if(actions[e.key]){e.preventDefault();actions[e.key]()}else if(/^[0-9]$/.test(e.key)){goto(e.key==='0'?scenes.length-1:+e.key-1)}});
window.addEventListener('beforeprint',()=>{stop();const old=scene,oldBeat=beat;el('printDeck').innerHTML=scenes.map((s,i)=>{scene=i;beat=s.beats.length-1;return `<div class="print-page"><div class="canvas ${s.id==='landscape'?'dark':s.id==='d4Replay'?'replay':''}">${markup(i)}</div></div>`}).join('');scene=old;beat=oldBeat;el('printDeck').querySelectorAll('[data-frame]').forEach(n=>n.classList.toggle('active',Number(n.dataset.frame)===n.parentElement.querySelectorAll('[data-frame]').length-1));el('printDeck').querySelectorAll('[data-beat]').forEach(n=>n.classList.add('shown'));el('printDeck').querySelectorAll('[data-step]').forEach(n=>n.classList.add('visible'))});
new ResizeObserver(size).observe(document.querySelector('.stage'));document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});const start=Number(location.hash.slice(1));if(Number.isInteger(start)&&start>=1&&start<=scenes.length)scene=start-1;render();
</script>
