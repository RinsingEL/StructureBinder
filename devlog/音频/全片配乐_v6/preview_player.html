<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Geomantia Devlog · v6 音画同步试听台</title>
<style>
  :root { --bg: #18171c; --panel: #23212a; --ink: #f3efe6; --muted: #a9a295; --accent: #9b82f3; --warm: #e6a96b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(155,130,243,.2); color: #cbbcff; font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14px 20px 20px; gap: 12px; }
  .stage-wrap { position: relative; width: min(1120px, 100%); aspect-ratio: 16 / 9; background: #100f12; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); }
  .stage-frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .controls { width: min(1120px, 100%); background: var(--panel); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,.07); }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  button.play { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer; min-width: 92px; }
  button.play:hover { filter: brightness(1.08); }
  input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .time { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 118px; text-align: right; }
  .chapters { display: flex; flex-wrap: wrap; gap: 7px; }
  .chap { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid rgba(255,255,255,.09); border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: .15s; }
  .chap:hover { background: rgba(155,130,243,.22); border-color: rgba(155,130,243,.5); }
  .chap.active { background: rgba(155,130,243,.34); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chap.b2 { border-color: rgba(230,169,107,.28); }
  .chap.b2.active { background: rgba(230,169,107,.28); border-color: var(--warm); }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="title">
    <span>🐾 Geomantia Devlog · v6 音画同步试听台</span>
    <span class="badge" id="themeBadge">加载中...</span>
  </div>
  <div class="meta" id="beatInfo">108 BPM · Bar 1 · Beat 1</div>
</header>
<main>
  <div class="stage-wrap" id="wrap">
    <iframe class="stage-frame" id="f1" src="../../视频素材/开场/opening.html?static"></iframe>
    <iframe class="stage-frame" id="f2" src="../../视频素材/第二段/act2.html?static" style="display:none"></iframe>
  </div>
  <div class="controls">
    <div class="bar-row">
      <button class="play" id="btnPlay">▶ 播放</button>
      <input type="range" id="seek" min="0" max="1006.667" step="0.05" value="0">
      <div class="time" id="timeLabel">00:00 / 16:46</div>
    </div>
    <div class="chapters" id="chapters"></div>
    <div class="hint">提示：点击任意章节标签直接空降试听；空格键播放/暂停，左右方向键 ±5 秒。</div>
  </div>
</main>
<audio id="aud" preload="auto"></audio>
<script>
const BPM = 108, BEAT = 60 / BPM;
const OP_DUR = 126.66666666666667;
const TOTAL = 1006.6666666666667;
document.getElementById('aud').src = '开场至第二段_完整_v6.mp3?t=' + Date.now();

const CHAPTERS = [
  { name: '0:00 开场 · 主题 A', t: 0.0, theme: '主题 A · D大调活动室' },
  { name: '0:49 Claude & Astra 介绍', t: 48.889, theme: '主题 A · D大调活动室' },
  { name: '1:25 DeepSeek & GLM 搞笑', t: 85.556, theme: '主题 A · D大调活动室' },
  { name: '2:09 第二段交接 (Rin)', t: 128.889, theme: '主题 B1 · 创世与山海' },
  { name: '2:29 W1 白纸留白', t: 148.889, theme: '主题 B1 · 白纸极简留白' },
  { name: '2:40 W2 九万格扫描', t: 160.0, theme: '主题 B1 · 扫描脉冲' },
  { name: '3:20 W3 山海长线', t: 200.0, theme: '主题 B1 · 山海舒展' },
  { name: '3:49 T1 七国 & T2-T3 扩张', t: 228.889, theme: '主题 B1 · 七国扩张' },
  { name: '6:29 T4 进镜潮学院!', t: 388.889, theme: '主题 B2 · G大调进城安家', b2: true },
  { name: '9:16 D1e 16区翻牌子', t: 555.556, theme: '主题 B2 · 16区翻牌', b2: true },
  { name: '11:04 D4 只落下一栋!', t: 664.444, theme: '主题 B2 · D4戏剧转折', b2: true },
  { name: '13:16 D6 拆开重排解开', t: 795.556, theme: '主题 B2 · 豁然开朗', b2: true },
  { name: '14:04 D7 十六区快放', t: 844.444, theme: '主题 B2 · 全城爬坡', b2: true },
  { name: '14:20 D-photos 实景照片', t: 860.0, theme: '主题 B2 · 实景温暖', b2: true },
  { name: '15:29 天象台二重奏', t: 928.889, theme: '主题 B2 · Rin×吉酱天象台二重奏', b2: true },
];

const wrap = document.getElementById('wrap');
const f1 = document.getElementById('f1');
const f2 = document.getElementById('f2');
const aud = document.getElementById('aud');
const seek = document.getElementById('seek');
const btnPlay = document.getElementById('btnPlay');
const timeLabel = document.getElementById('timeLabel');
const beatInfo = document.getElementById('beatInfo');
const themeBadge = document.getElementById('themeBadge');
const chapBox = document.getElementById('chapters');

function fit() {
  const s = wrap.clientWidth / 1920;
  f1.style.transform = `scale(${s})`;
  f2.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
fit();

function fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

CHAPTERS.forEach((ch, idx) => {
  const b = document.createElement('button');
  b.className = 'chap' + (ch.b2 ? ' b2' : '');
  b.textContent = ch.name;
  b.onclick = () => {
    aud.currentTime = ch.t;
    renderAt(ch.t);
    if (aud.paused) togglePlay();
  };
  ch.btn = b;
  chapBox.appendChild(b);
});

function togglePlay() {
  if (aud.paused) {
    aud.play();
    btnPlay.textContent = '⏸ 暂停';
  } else {
    aud.pause();
    btnPlay.textContent = '▶ 播放';
  }
}
btnPlay.onclick = togglePlay;

let dragging = false;
function seekTo(t, autoPlay = false) {
  const clamped = Math.max(0, Math.min(TOTAL, t));
  if (aud.readyState >= 1) {
    aud.currentTime = clamped;
  } else {
    aud.addEventListener('loadedmetadata', () => { aud.currentTime = clamped; }, { once: true });
  }
  renderAt(clamped);
  if (autoPlay && aud.paused) togglePlay();
}

CHAPTERS.forEach((ch) => {
  ch.btn.onclick = () => seekTo(ch.t, true);
});

seek.oninput = () => {
  dragging = true;
  renderAt(parseFloat(seek.value));
};
seek.onchange = () => {
  seekTo(parseFloat(seek.value));
  dragging = false;
};

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') { seekTo((aud.currentTime || 0) + 5); }
  else if (e.code === 'ArrowLeft') { seekTo((aud.currentTime || 0) - 5); }
});

let atlasWin = null;
let atlasBox = null;
let lastAtlasKey = '';

function setupAct2Atlas() {
  try {
    const f2Win = f2.contentWindow;
    const f2Doc = f2.contentDocument;
    if (!f2Win || !f2Doc) return;
    f2Win.externalPpt = true;
    const ppt = f2Doc.getElementById('ppt');
    const board = f2Doc.getElementById('board');
    if (!board || f2Doc.getElementById('atlas-box')) return;
    if (ppt) ppt.style.display = 'none';

    atlasBox = f2Doc.createElement('div');
    atlasBox.id = 'atlas-box';
    Object.assign(atlasBox.style, {
      width: '1438px',
      height: '640px',
      overflow: 'hidden',
      mixBlendMode: 'multiply',
      position: 'relative',
      visibility: 'hidden',
      pointerEvents: 'none',
    });

    const atlasFrame = f2Doc.createElement('iframe');
    atlasFrame.id = 'atlas-frame';
    atlasFrame.src = '../../act2/wtd-atlas.html';
    Object.assign(atlasFrame.style, {
      width: '1600px',
      height: '900px',
      border: '0',
      transform: 'scale(0.89875)',
      transformOrigin: '0 0',
      display: 'block',
      pointerEvents: 'none',
    });
    atlasFrame.onload = () => {
      try {
        const aw = atlasFrame.contentWindow;
        aw.eval(`
          window.__seek = (i, pr) => {
            cancelAnimationFrame(frame); frame = 0;
            const sheet = document.getElementById('sheet');
            if (sheet.style.transform !== 'scale(1)') layout();
            const prevT = i > 0 ? beats[i - 1][4] : base;
            index = i; scene = legacyScene(beats[i][0]); displayMeta();
            const target = beats[i][4], t = ease(Math.max(0, Math.min(1, pr)));
            current = {}; for (const k in target) current[k] = mix(prevT[k] ?? target[k], target[k], t);
            draw(current, pr);
          };
        `);
        atlasWin = aw;
        lastAtlasKey = '';
        window.focus();
        renderAt(dragging ? parseFloat(seek.value) : (aud.currentTime || 0));
      } catch (err) {}
    };
    atlasBox.appendChild(atlasFrame);
    board.appendChild(atlasBox);
  } catch (err) {}
}

function renderAt(t) {
  const inAct1 = t < OP_DUR;
  f1.style.display = inAct1 ? 'block' : 'none';
  f2.style.display = inAct1 ? 'none' : 'block';
  const target = inAct1 ? f1 : f2;
  const localT = inAct1 ? t : t - OP_DUR;
  try {
    if (target.contentWindow && typeof target.contentWindow.render === 'function') {
      target.contentWindow.render(localT);
    }
    if (inAct1) {
      lastAtlasKey = '';
    } else if (target.contentWindow && typeof target.contentWindow.beatAt === 'function') {
      const bt = target.contentWindow.beatAt(localT);
      if (atlasBox) atlasBox.style.visibility = bt ? 'visible' : 'hidden';
      if (bt && atlasWin && typeof atlasWin.__seek === 'function') {
        const key = `${bt.index}:${bt.progress.toFixed(4)}`;
        if (key !== lastAtlasKey) {
          lastAtlasKey = key;
          atlasWin.__seek(bt.index, bt.progress);
        }
      }
    }
  } catch (err) {}

  if (!dragging) seek.value = t;
  timeLabel.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;

  const totalBeat = Math.floor(t / BEAT);
  const bar = Math.floor(totalBeat / 4) + 1;
  const inBar = (totalBeat % 4) + 1;
  beatInfo.textContent = `108 BPM · Bar ${bar} · Beat ${inBar}`;

  let cur = CHAPTERS[0];
  for (const ch of CHAPTERS) {
    if (t >= ch.t - 0.05) cur = ch;
  }
  themeBadge.textContent = cur.theme;
  CHAPTERS.forEach(ch => ch.btn.classList.toggle('active', ch === cur));
}

function tick() {
  if (!dragging) renderAt(aud.currentTime || 0);
  requestAnimationFrame(tick);
}
f1.onload = () => renderAt(dragging ? parseFloat(seek.value) : (aud.currentTime || 0));
f2.onload = () => {
  setupAct2Atlas();
  renderAt(dragging ? parseFloat(seek.value) : (aud.currentTime || 0));
};
requestAnimationFrame(tick);
</script>
</body>
</html>
