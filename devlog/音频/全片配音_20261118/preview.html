<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社团开放日 · 全片原速预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#302d29;font:15px system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #d6d0c5;display:flex;align-items:center;gap:16px}h1{font-size:21px;margin:0}small{color:#726b61}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:18px}#screen{width:100%;aspect-ratio:16/9;background:#252320;overflow:hidden;position:relative;border-radius:10px}iframe{position:absolute;top:0;left:0;width:1920px;height:1080px;border:0;transform-origin:0 0}button,select{font:inherit;border:1px solid #c9c1b4;border-radius:7px;background:#fffdf8;padding:8px 12px;color:inherit;cursor:pointer}button:hover{background:#e9e1d2}#play{background:#75553d;color:white;min-width:90px}.controls{padding:16px;background:#fffdf8;border-radius:10px;margin-top:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#seek{width:100%;margin:18px 0;accent-color:#886247}#now{margin-top:12px;line-height:1.7;min-height:45px}.status{font-size:13px;color:#756b5e;margin-top:10px}aside{background:#fffdf8;border-radius:10px;padding:16px;max-height:85vh;display:flex;flex-direction:column}h2{font-size:17px;margin:0 0 12px}#issues{overflow:auto;margin-top:12px}.issue{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;line-height:1.6}.tag{color:#9b4d38;font-size:12px}.issue small{display:block}.issue.active{outline:2px solid #987653}a{color:#78553d}#loading{position:absolute;inset:0;display:grid;place-items:center;color:white;pointer-events:none}@media(max-width:950px){main{grid-template-columns:1fr}aside{max-height:50vh}header{flex-wrap:wrap}}
</style>
<header><h1>社团开放日 · 全片原速预览</h1><small>画面实时播放 · 五人配音原速 · Rin 气泡 · 约 37:40</small></header>
<main><section><div id="screen"><iframe id="stage" title="实时舞台"></iframe><div id="loading">载入画面…</div></div><div class="controls"><div class="row"><button id="play">播放</button><button id="back">退 5 秒</button><button id="forward">进 5 秒</button><select id="act" aria-label="选择幕"></select><span id="clock">00:00 / 37:40</span></div><input id="seek" aria-label="全片播放进度" type="range" min="0" max="2260" step="0.05" value="0"><div class="row"><label>音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label><label><input id="autonext" type="checkbox" checked> 自动接下一幕</label><button id="restart">本幕重播</button></div><div id="now"></div><div id="status" class="status">这是预览与定位播放器，尚未提供拖动台词或保存编辑的功能。</div></div><p><a href="节奏排查/全片问题清单.md">完整节奏问题清单</a> · <a href="节奏排查/定位试听.html">原始配音对照试听</a></p></section>
<aside><h2>接话节奏 · 待复听位置</h2><small>点击跳到前 3 秒。阈值筛查不代表错误；转场、看图与呼吸可能需要留白。</small><div class="row" style="margin-top:12px"><select id="filterAct" aria-label="按幕筛选"><option value="">全部幕</option></select><select id="filterType" aria-label="按类型筛选"><option value="">全部类型</option><option>接话较紧</option><option>较长间隔</option><option>原声内部停顿</option></select></div><div id="count" class="status"></div><div id="issues"></div></aside></main>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id),audio=$('audio'),frame=$('stage');let data,idx=0,ready=false,pendingTime=0,autoPlay=false,currentCue='',switching=false;
const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
function resize(){frame.style.transform=`scale(${$('screen').clientWidth/1920})`;}new ResizeObserver(resize).observe($('screen'));
function draw(){if(!data)return;const act=data.acts[idx],t=audio.currentTime||0;if(ready){try{frame.contentWindow.render(t);}catch(e){$('status').textContent='画面异常：'+e.message;audio.pause();}}
 $('seek').value=act.offset+t;$('clock').textContent=`${fmt(act.offset+t)} / ${fmt(data.duration)} · 幕内 ${fmt(t)}`;
 const c=act.cards.find(c=>t>=c.start&&t<c.end);const text=c?`${c.who}：${c.text}`:'（画面停留）';if(text!==currentCue){$('now').textContent=text;currentCue=text;}
 $('play').textContent=audio.paused?'播放':'暂停';}
function tick(){draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
function maybeStart(){if(!ready||!audio.readyState)return;switching=false;audio.currentTime=pendingTime;draw();if(autoPlay)audio.play().catch(e=>{$('status').textContent='请点“播放”开始音频。';});autoPlay=false;}
function loadAct(i,t=0,play=false){audio.pause();idx=i;ready=false;switching=true;pendingTime=Math.max(0,Math.min(data.acts[i].duration-.01,t));autoPlay=play;$('act').value=i;$('loading').style.display='grid';frame.src=data.acts[i].html+'?static';audio.src=data.acts[i].audio;audio.load();}
frame.onload=()=>{if(typeof frame.contentWindow.render!=='function')return;ready=true;$('loading').style.display='none';resize();maybeStart();};audio.onloadedmetadata=maybeStart;
function seek(t,play=!audio.paused){t=Math.max(0,Math.min(data.duration-.02,t));let i=data.acts.findIndex(a=>t<a.offset+a.duration);if(i<0)i=data.acts.length-1;if(i!==idx||!ready){loadAct(i,t-data.acts[i].offset,play);return;}audio.currentTime=t-data.acts[i].offset;if(play)audio.play().catch(()=>{});draw();}
$('play').onclick=()=>{if(switching){autoPlay=true;return;}if(audio.paused)audio.play().catch(e=>$('status').textContent=e.message);else audio.pause();};
$('back').onclick=()=>seek(data.acts[idx].offset+audio.currentTime-5);$('forward').onclick=()=>seek(data.acts[idx].offset+audio.currentTime+5);$('seek').oninput=e=>seek(+e.target.value);$('act').onchange=e=>loadAct(+e.target.value,0,!audio.paused);$('restart').onclick=()=>seek(data.acts[idx].offset);$('volume').oninput=e=>audio.volume=+e.target.value;
audio.onended=()=>{if($('autonext').checked&&idx<data.acts.length-1)loadAct(idx+1,0,true);};audio.onerror=()=>$('status').textContent='音频载入失败，请检查本地服务和文件。';
function listIssues(){const items=data.issues.filter(x=>(!$('filterAct').value||x.act===$('filterAct').value)&&(!$('filterType').value||x.type===$('filterType').value));$('count').textContent=`${items.length} 个候选位置`;$('issues').replaceChildren();for(const x of items){const b=document.createElement('button');b.className='issue';const tag=document.createElement('div');tag.className='tag';tag.textContent=`${fmt(x.global)} · ${x.act} ${fmt(x.time)} · ${x.type} ${x.duration.toFixed(2)}s`;const text=document.createElement('div');text.textContent=x.who+'：'+x.text;const note=document.createElement('small');note.textContent=x.note;b.append(tag,text,note);b.onclick=()=>{document.querySelectorAll('.issue.active').forEach(e=>e.classList.remove('active'));b.classList.add('active');seek(Math.max(data.acts.find(a=>a.name===x.act).offset,x.global-3),true);};$('issues').append(b);}}
$('filterAct').onchange=listIssues;$('filterType').onchange=listIssues;
fetch('preview_data.json').then(r=>r.json()).then(d=>{data=d;$('seek').max=d.duration;d.acts.forEach((a,i)=>{const o=document.createElement('option');o.value=i;o.textContent=a.name;$('act').append(o);const f=document.createElement('option');f.value=a.name;f.textContent=a.name;$('filterAct').append(f);});listIssues();const q=new URLSearchParams(location.search);const i=Math.max(0,d.acts.findIndex(a=>a.name===q.get('act')));loadAct(i,+(q.get('t')||0));}).catch(e=>$('status').textContent='加载失败：'+e.message);
</script></html>
