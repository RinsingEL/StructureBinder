<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第五段 · 再见</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=block">
<style>
  :root { --ink: #3a3631; --soft: #8c8274; }
  html, body { margin: 0; background: #1e1d1b; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif; }
  #room { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  /* 白板内侧 x 122–1799，y 41–697 */
  #board { position: absolute; left: 122px; top: 41px; width: 1677px; height: 656px; overflow: hidden; color: var(--ink); }
  #board > * { position: absolute; }
  #thanks { left: 0; top: 0; width: 1677px; height: 656px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "ZCOOL KuaiLe", sans-serif; opacity: 0; }
  #thanks .big { font-size: 180px; letter-spacing: 16px; color: var(--ink); }
  #thanks .small { font-size: 40px; color: var(--soft); margin-top: 18px; letter-spacing: 6px; }
  #doodle { left: 0; top: 0; opacity: 0; }
  #frame { position: absolute; inset: 0; z-index: 40; pointer-events: none; box-sizing: border-box; border: 0 solid #fffdf8; opacity: 0; }
  #flash { position: absolute; inset: 0; z-index: 41; background: #fff; opacity: 0; pointer-events: none; }
  #framecap { position: absolute; left: 0; right: 0; bottom: 6px; z-index: 42; text-align: center; font-family: "ZCOOL KuaiLe"; font-size: 30px; color: var(--soft); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <img id="room" src="../开放日插画/clubroom_v2.png" alt="">
  <div id="board">
    <!-- 白板上只留一句谢谢，四周的小涂鸦慢慢转、慢慢飘 -->
    <div id="thanks"><div class="big">谢谢大家！</div><div class="small">Geomantia 社团开放日</div></div>
    <svg id="doodle" width="1677" height="656"></svg>
  </div>
  <div id="flash" data-overlay></div>
  <div id="frame" data-overlay></div>
  <div id="framecap" data-overlay>Geomantia 社团开放日 · 2026 年 11 月</div>
</div>
<script>window.STAGE_CONFIG = { INTRO: 1.2, OUTRO: 4.5, RISE: 0.2, HOLD_LAST: true };</script>
<script src="act5_script.js"></script>
<script src="../common/stage.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
// 涂鸦：x, y, 种类, 大小
const DOODLES = [[180, 140, 'star', 1.2], [1490, 120, 'gear', 1.1], [260, 500, 'flower', 1], [1420, 510, 'star', 0.9], [120, 330, 'gear', 0.8],
  [1560, 330, 'flower', 1.1], [520, 90, 'spark', 1], [1150, 90, 'spark', 0.8], [640, 590, 'spark', 0.9], [1060, 590, 'flower', 0.8]];
function doodle(kind, t) {
  if (kind === 'star') return '<path d="M0 -26 L7 -8 L26 -8 L11 4 L16 24 L0 12 L-16 24 L-11 4 L-26 -8 L-7 -8Z" fill="#f6d36b" stroke="#c9902a" stroke-width="2"/>';
  if (kind === 'spark') return '<path d="M0 -22 L5 -5 L22 0 L5 5 L0 22 L-5 5 L-22 0 L-5 -5Z" fill="#9cc3d8"/>';
  if (kind === 'flower') { let p = ''; for (let k = 0; k < 5; k++) p += `<ellipse cx="0" cy="-13" rx="8" ry="13" fill="#e8707a" transform="rotate(${k * 72})"/>`; return p + '<circle r="7" fill="#f6d36b"/>'; }
  let d = ''; for (let i = 0; i < 32; i++) { const a = i / 32 * Math.PI * 2, r = Math.floor(i / 2) % 2 ? 22 : 28; d += (i ? 'L' : 'M') + (r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1); }
  return `<path d="${d}Z" fill="#e2b04a" stroke="#3a3631" stroke-width="2.5"/><circle r="8" fill="#fffdf8" stroke="#3a3631" stroke-width="2.5"/>`;
}
window.drawBoard = function (time) {
  $('thanks').style.opacity = ease(time / 0.8);
  $('doodle').style.opacity = ease((time - 0.6) / 0.8);
  $('doodle').innerHTML = DOODLES.map(([x, y, k, s], i) => {
    const rot = k === 'gear' ? time * 40 * (i % 2 ? -1 : 1) : 8 * Math.sin(time * 1.3 + i);
    const fy = y + 6 * Math.sin(time * 1.6 + i * 1.7);
    const sc = s * (k === 'spark' ? 0.8 + 0.25 * Math.sin(time * 3 + i) : 1);
    return `<g transform="translate(${x} ${fy}) rotate(${rot}) scale(${sc})">${doodle(k, time)}</g>`;
  }).join('');
};
// 定格：一下快门白光，画面停住，再收成一张照片
const baseRender = window.render;
window.render = function (time) {
  const freeze = MARKS.bye + 1.4;
  baseRender(Math.min(time, freeze));
  const f = time - freeze;
  $('flash').style.opacity = f > 0 ? 0.85 * (1 - ease(f / 0.5)) : 0;
  $('frame').style.opacity = f > 0 ? 1 : 0;
  $('frame').style.borderWidth = (f > 0 ? 34 * ease(f / 0.6) : 0) + 'px';
  $('frame').style.borderBottomWidth = (f > 0 ? 56 * ease(f / 0.6) : 0) + 'px';
  $('framecap').style.opacity = ease((f - 0.5) / 0.6);
};
</script>
</body>
</html>
