<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第二段 · 看流程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=block">
<style>
  :root { --ink: #3a3631; }
  html, body { margin: 0; background: #1e1d1b; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif; }
  #room { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  /* 白板内侧 x 122–1799，y 41–697 */
  #cover { position: absolute; left: 122px; top: 41px; width: 1677px; height: 656px; }
  #board { position: absolute; left: 136px; top: 49px; width: 1649px; height: 640px; display: flex; align-items: center; justify-content: center; }
  #ppt { width: 1438px; height: 640px; object-fit: cover; object-position: top; display: block; mix-blend-mode: multiply; }
  /* 讲解时镜头推近白板：#cam 整体放大，#mat 是一张挖了窗口的底纸，只露出 PPT */
  #cam { position: absolute; inset: 0; transform-origin: 0 0; }
  #mat { position: absolute; inset: 0; overflow: hidden; opacity: 0; z-index: 30; pointer-events: none; }
  #win { position: absolute; left: 60px; top: 26px; width: 1800px; height: 801px; border-radius: 10px; box-shadow: 0 0 0 3000px #efe6d6; }
  #winline { position: absolute; left: 58px; top: 24px; width: 1800px; height: 801px; border-radius: 12px; border: 2px solid rgba(60,40,20,.14); }
  /* 讲解时的头像和对话气泡 */
  #band { position: absolute; inset: 0; z-index: 31; pointer-events: none; }
  /* 天象台照片：从照片墙里放大，聊天时镜头慢慢平移 */
  #obsdim { position: absolute; left: 60px; top: 26px; width: 1800px; height: 801px; border-radius: 10px; background: rgba(239,230,214,.7); z-index: 30; opacity: 0; }
  #obs { position: absolute; z-index: 30; background: #fffdf8; box-shadow: 0 10px 28px rgba(60,40,20,.28); opacity: 0; box-sizing: border-box; }
  #obs .ph { position: absolute; overflow: hidden; }
  #obs .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  #obs .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 22px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  /* 头像像小泡泡一样弹出来：白边外面一圈淡淡的泡泡膜，左上角一点高光 */
  .av { position: absolute; width: 170px; height: 170px; margin: -85px 0 0 -85px; }
  .av .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #fffdf8;
    box-shadow: 0 0 0 5px #fff, 0 0 0 11px rgba(190,220,240,.45), 0 6px 16px rgba(60,40,20,.22); }
  .av .gloss { position: absolute; inset: -9px; border-radius: 50%; border: 4px solid transparent; border-top-color: rgba(255,255,255,.9); transform: rotate(-45deg); }
  .av .burst { position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(190,220,240,.9); opacity: 0; }
  .av img { position: absolute; width: 340px; height: 340px; opacity: 0; }
  .member { position: absolute; width: 420px; height: 420px; bottom: -64px; transform-origin: 50% 100%; }
  .member img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(60,40,20,.25)); }
  #sub { position: absolute; z-index: 33; left: 600px; right: 600px; top: 740px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #name { font-size: 26px; font-weight: 700; color: #fff; padding: 4px 18px; border-radius: 999px; margin-bottom: 14px; letter-spacing: 2px; }
  #line { font-size: 30px; line-height: 1.5; color: var(--ink); text-align: center; background: rgba(255,253,247,.94); padding: 16px 30px;
    border-radius: 14px; box-shadow: 0 4px 14px rgba(60,40,20,.12); max-width: 660px; text-wrap: balance; white-space: pre-line; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <img id="room" src="../开放日插画/clubroom_v2.png" alt="">
    <img id="cover" src="cover_board.jpg" alt="">
    <div id="board"><img id="ppt" alt=""></div>
    <div id="members"></div>
  </div>
  <div id="sub"><div id="name"></div><div id="line"></div></div>
  <div id="mat"><div id="win"></div><div id="winline"></div></div>
  <div id="obsdim"></div>
  <div id="obs"><div class="ph"><img src="../../../dev_docs/systems/city/reports/20261031_学院功能区实景报告/evidence/observatory.jpg" alt=""></div><div class="cap">天象台<span> · 原版地形 + 道路遇水自动搭桥</span></div></div>
  <div id="band"></div>
</div>
<script src="act2_script.js"></script>
<script>
const SPRITES = '../../act2/assets/avatars/sprites/compact/';
const HEADS = '../../act2/assets/avatars/heads/';
const PAGES = '../../act2/分页图/';
const members = [
  { id: 'rin',      name: 'Rin',      color: '#8a6a4f', x: -40,  z: 1 },
  { id: 'gemini',   name: 'Gemini',   color: '#8a63d2', x: 125,  z: 2 },
  { id: 'claude',   name: 'Claude',   color: '#d9772b', x: 290,  z: 3 },
  { id: 'astra',    name: 'Astra',    color: '#7f8db5', x: 1225, z: 3 },
  { id: 'deepseek', name: 'DeepSeek', color: '#3a6fc4', x: 1380, z: 2 },
  { id: 'glm',      name: 'GLM',      color: '#3d3d46', x: 1520, z: 1 },
];
const states = ['listen', 'greet', 'd4', 'talk_smile', 'think', 'moved', 'wry'];
const FALLBACK = { think: ['d4', 'talk_smile'], talk_smile: ['d4'], d4: ['talk_smile'], greet: ['listen'], moved: ['talk_smile'], wry: ['d4'] };
const { beats: BEATS, durations: DUR, lines: SCRIPT } = window.ACT2;

// 时间线：每屏字幕按每秒约 6 字计时。要翻页时，如果上一拍的动画还没播完，就先停在那里等它播完（例如 D7 全城快放）
const INTRO = 0.8, OUTRO = 2.4, GAP = 0.25;
// 镜头只在两句话之间推近、拉回：第一拍那句话之前、最后一句（Gemini 接第三段）之前各停 CAM 秒，镜头在停顿里动完
const CAM = 1.4, ZD = 1.2;
const CAM_IN_LINE = SCRIPT.findIndex(l => l.cards.some(c => c.beat)), CAM_OUT_LINE = SCRIPT.length - 1;
let Z0 = 0, Z1 = 0;
const timeline = [], beatStarts = [];
let t = INTRO, curBeat = -1;
for (const [li, line] of SCRIPT.entries()) {
  if (li === CAM_IN_LINE) { Z0 = t + 0.05; t += CAM; }
  if (li === CAM_OUT_LINE) { Z1 = t + 0.05; t += CAM; }
  let lineStart = null;
  for (const c of line.cards) {
    const b = c.beat ? BEATS.indexOf(c.beat) : -1;
    if (b >= 0 && b !== curBeat) {
      if (curBeat >= 0) {
        const last = beatStarts[beatStarts.length - 1];
        t = Math.max(t, last.t + DUR[curBeat] + 0.4);
      }
      beatStarts.push({ beat: b, t: t + 0.2 });
      curBeat = b;
    }
    if (lineStart === null) lineStart = t;
    const dur = Math.max(1.8, c.text.replace(/\n/g, '').length / 6 + 0.7);
    timeline.push({ id: line.id, who: line.who, face: c.face, text: c.text, start: t, end: t + dur, lineStart });
    t += dur;
  }
  t += GAP;
}
window.DURATION = t + OUTRO;

// 当前该显示第几拍、播到几成，录制脚本用它去驱动第二幕 PPT
window.beatAt = function (time) {
  let cur = null;
  for (const s of beatStarts) if (s.t <= time) cur = s;
  if (!cur) return null;
  const d = DUR[cur.beat];
  return { index: cur.beat, id: BEATS[cur.beat], progress: d ? Math.min(1, (time - cur.t) / d) : 1, since: time - cur.t };
};

const box = document.getElementById('members');
for (const m of members) {
  const el = document.createElement('div');
  el.className = 'member'; el.style.left = m.x + 'px'; el.id = 'm-' + m.id;
  for (const s of states) {
    const img = document.createElement('img');
    img.dataset.state = s; img.src = SPRITES + m.id + '/' + s + '.png';
    img.onerror = () => img.remove();
    el.appendChild(img);
  }
  box.appendChild(el);
}

const $ = id => document.getElementById(id);
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const SWAP = 0.15, HOLD = 2.0, HOLD_UNTIL_NEXT = false;
const cueAt = time => timeline.find(c => time >= c.start && time < c.end);
function available(id, state) {
  const el = $('m-' + id);
  if (el.querySelector(`img[data-state="${state}"]`)) return state;
  for (const alt of FALLBACK[state] || []) if (el.querySelector(`img[data-state="${alt}"]`)) return alt;
  return 'listen';
}
function faceAt(id, time) {
  const c = cueAt(time);
  if (c && c.who === id) return available(id, c.face);
  let last = null;
  for (const x of timeline) { if (x.start > time) break; if (x.who === id && x.end <= time) last = x; }
  if (last && (HOLD_UNTIL_NEXT || time - last.end < HOLD)) return available(id, last.face);
  return 'listen';
}
function dimAt(id, time) { const c = cueAt(time); return !!c && c.who !== id; }
const boundaries = [...new Set(timeline.flatMap(c => [c.start, c.end, c.end + HOLD]))].sort((a, b) => a - b);
function lastChange(fn, time, dur) {
  for (let i = boundaries.length - 1; i >= 0; i--) {
    const b = boundaries[i];
    if (b > time) continue;
    if (time - b >= dur) return null;
    if (fn(b - 0.001) !== fn(b)) return b;
  }
  return null;
}

// 录制时由脚本传入当前 PPT 画面；直接打开预览时用分页图代替
window.externalPpt = false;
const PAGE_FILE = { W1: '01_W1', W2: '02_W2', W3a: '03_W3a', W3b: '04_W3b', W3c: '05_W3c', T1: '06_T1', T2: '07_T2', T3: '08_T3', 'T3-end': '09_T3-end',
  T4: '10_T4', D1: '11_D1', D1b: '12_D1b', D1c: '13_D1c', D1d: '14_D1d', D1e: '15_D1e', D2: '16_D2', D3: '17_D3', D4: '18_D4', D5a: '19_D5a', D5b: '20_D5b',
  D6: '21_D6', D7: '22_D7', 'D-photos': '23_D-photos' };


// 讲解时的镜头：第一拍开始时推近白板，PPT 铺满画面；最后一句说完再拉回活动室
const HEAD = { rin: [125, 95], gemini: [130, 100], claude: [130, 100], astra: [150, 100], deepseek: [145, 100], glm: [148, 95] }; // 立绘缩到 300px 时脸的位置
const SLOT = { rin: 120, gemini: 290, claude: 460, astra: 1460, deepseek: 1630, glm: 1800 };
const LEFT = new Set(['rin', 'gemini', 'claude']);
const K = 1800 / 1438.2, TX = 60 - 241.4 * K, TY = 26 - 49 * K;
// 头像在说完话、表情余韵（HOLD）结束前消失，消失动画结束时正好切回站立
const STAY = HOLD - 0.35;
const inout = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
for (const m of members) {
  const av = document.createElement('div');
  av.className = 'av'; av.id = 'av-' + m.id; av.style.left = SLOT[m.id] + 'px'; av.style.top = '955px';
  const [hx, hy] = HEAD[m.id];
  const faceBox = document.createElement('div'); faceBox.className = 'face'; av.appendChild(faceBox);
  for (const s of states) {
    const img = document.createElement('img');
    // 头像用单独的头像图（../../act2/assets/avatars/heads/），以后换成新画的头像也不用改这里
    img.dataset.state = s; img.src = HEADS + m.id + '/' + s + '.webp';
    Object.assign(img.style, { left: 0, top: 0, width: '100%', height: '100%' });
    img.onerror = () => img.remove();
    faceBox.appendChild(img);
  }
  av.insertAdjacentHTML('beforeend', '<div class="gloss"></div><div class="burst"></div>');
  $('band').appendChild(av);
}
// 天象台：Rin 说"我最喜欢那张天象台"时放大，GLM 说完"明信片"再缩回照片墙
const OBS_FROM = { x: 1366, y: 113, w: 382, h: 199 }, OBS_TO = { x: 150, y: 40, w: 1620, h: 774 };
const OBS0 = timeline.find(c => c.id === '2-60').start + 0.5, OBS1 = timeline.filter(c => c.id === '2-62').pop().end + 0.2, OBS_D = 0.8;
function drawObservatory(time, op) {
  const k = inout((time - OBS0) / OBS_D) * (1 - inout((time - OBS1) / OBS_D));
  const box = $('obs');
  box.style.opacity = k > 0.001 ? op : 0;
  $('obsdim').style.opacity = op * k;
  const r = {}; for (const key of ['x', 'y', 'w', 'h']) r[key] = OBS_FROM[key] + (OBS_TO[key] - OBS_FROM[key]) * k;
  Object.assign(box.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  const pad = 8 + 6 * k, capH = 36 + 18 * k;
  Object.assign(box.querySelector('.ph').style, { left: pad + 'px', top: pad + 'px', right: pad + 'px', bottom: capH + 'px' });
  const cap = box.querySelector('.cap');
  cap.querySelector('span').style.opacity = clamp((k - 0.6) / 0.4);
  cap.style.fontSize = (20 + 10 * k) + 'px'; cap.style.lineHeight = capH + 'px'; cap.style.paddingLeft = (pad + 4) + 'px';
  // 放大以后镜头慢慢往右平移、稍微推近
  const kb = clamp((time - OBS0 - OBS_D) / (OBS1 - OBS0 - OBS_D));
  box.querySelector('img').style.transform = `scale(${1 + 0.08 * kb}) translateX(${-2.5 * kb}%)`;
}
function lastEndOf(id, time) { let e = null; for (const x of timeline) { if (x.start > time) break; if (x.who === id && x.end <= time) e = x.end; } return e; }
function speakingAt(id, time) { const c = cueAt(time); return !!c && c.who === id; }
function shownAt(id, time) { if (speakingAt(id, time)) return true; const e = lastEndOf(id, time); return e !== null && e > Z0 && time - e < STAY; }
function drawBand(time, op) {
  const cue = cueAt(time);
  for (const m of members) {
    const av = $('av-' + m.id);
    let sc = 0, burst = -1;
    if (shownAt(m.id, time)) {
      sc = 1;
      if (cue && cue.who === m.id && !shownAt(m.id, cue.lineStart - 0.001)) { sc = backOut((time - cue.lineStart) / 0.4); burst = (time - cue.lineStart) / 0.5; }
    } else {
      const e = lastEndOf(m.id, time);
      if (e !== null && e > Z0 && time - e < STAY + 0.35) sc = 1 - ease((time - e - STAY) / 0.35);
      else if (e === null || time - e >= STAY + 0.35) sc = 0;
    }
    const spk = speakingAt(m.id, time), ch = lastChange(x => speakingAt(m.id, x), time, 0.25);
    let big = spk ? 1 : 0;
    if (ch !== null) { const q = (time - ch) / 0.25; big = spk ? ease(q) : 1 - ease(q); }
    const size = 0.72 + 0.28 * big;
    const hop = spk ? 18 * Math.sin(Math.PI * clamp((time - cue.lineStart) / 0.35)) : 0;
    av.style.opacity = op * (sc > 0 ? 1 : 0);
    const float = (1 - big) * 5 * Math.sin(time * 2.2 + SLOT[m.id]);
    av.style.transform = `translateY(${-hop + (1 - big) * 22 + float}px) scale(${Math.max(0, sc) * size})`;
    const bu = av.querySelector('.burst');
    bu.style.opacity = burst >= 0 && burst < 1 ? 1 - burst : 0;
    bu.style.transform = `scale(${1 + 0.45 * clamp(burst)})`;
    av.style.filter = `brightness(${0.86 + 0.14 * big})`;
    av.style.zIndex = spk ? 2 : 1;
    const face = faceAt(m.id, time), fc = lastChange(x => faceAt(m.id, x), time, SWAP);
    const k = fc === null ? 1 : (time - fc) / SWAP, prev = fc === null ? face : faceAt(m.id, fc - 0.001);
    for (const img of av.querySelectorAll('img')) { const s = img.dataset.state; img.style.opacity = s === face ? k : (s === prev && k < 1 ? 1 - k : 0); }
  }
}

window.render = function (time) {
  const c = inout((time - Z0) / ZD) * (1 - inout((time - Z1) / ZD));
  $('cam').style.transform = `translate(${TX * c}px, ${TY * c}px) scale(${1 + (K - 1) * c})`;
  const full = clamp((c - 0.8) / 0.2);
  $('mat').style.opacity = full;
  $('band').style.opacity = full;
  const b = window.beatAt(time);
  const first = beatStarts[0].t;
  $('cover').style.opacity = 1 - ease((time - first + 0.4) / 0.6);
  $('board').style.opacity = ease((time - first) / 0.5);
  if (!window.externalPpt && b) { const src = PAGES + PAGE_FILE[b.id] + '.jpg'; if (!$('ppt').src.endsWith(encodeURI(src).split('/').pop())) $('ppt').src = src; }

  const cue = cueAt(time);
  members.forEach(m => {
    const el = $('m-' + m.id);
    const speaking = cue && cue.who === m.id;
    const face = faceAt(m.id, time);
    const changedAt = lastChange(x => faceAt(m.id, x), time, SWAP);
    const k = changedAt === null ? 1 : (time - changedAt) / SWAP;
    const prev = changedAt === null ? face : faceAt(m.id, changedAt - 0.001);
    for (const img of el.querySelectorAll('img')) {
      const s = img.dataset.state;
      img.style.opacity = s === face ? k : (s === prev && k < 1 ? 1 - k : 0);
    }
    // 只在开口换表情时"弹"一下；说完话回到站立时只是淡淡换过去，免得安静的时候突然一弹
    const squash = k < 1 && speaking ? 1 - 0.04 * Math.sin(k * Math.PI) : 1;
    const dimNow = dimAt(m.id, time), dimChanged = lastChange(x => dimAt(m.id, x), time, 0.25);
    let d = dimNow ? 1 : 0;
    if (dimChanged !== null) { const q = (time - dimChanged) / 0.25; d = dimNow ? q : 1 - q; }
    el.style.filter = `brightness(${1 - 0.28 * d}) saturate(${1 - 0.2 * d})`;
    let lift = 0, scale = 1;
    // 推近以后底下的立绘直接隐藏，也不再弹跳和浮动，免得头顶从 PPT 下沿露出来
    el.style.opacity = 1 - clamp(c / 0.6);
    if (speaking && c < 0.01) {
      const s = time - cue.lineStart;
      lift = 26 * Math.sin(Math.min(s / 0.35, 1) * Math.PI) * (s < 0.35 ? 1 : 0) + 10 + 3 * Math.sin(time * 6);
      scale = 1.08;
    }
    el.style.transform = `translateY(${-lift}px) scale(${scale * (2 - squash)}, ${scale * squash})`;
    el.style.zIndex = speaking ? 10 : m.z;
  });
  const name = $('name'), line = $('line');
  if (cue) {
    const who = members.find(m => m.id === cue.who);
    name.textContent = who.name; name.style.background = who.color; if (line.textContent !== cue.text) {
      // 字幕框收紧到文字的实际宽度，换行后不留一大块空白
      line.style.width = ''; line.textContent = cue.text;
      const r = document.createRange(); r.selectNodeContents(line);
      // 多留几像素，免得标点挤到下一行
      // 草稿模式整页缩小时，量出来的宽度也跟着缩小，要换算回页面上的像素
      const zoom = line.getBoundingClientRect().width / line.offsetWidth || 1;
      line.style.width = Math.ceil(Math.max(...[...r.getClientRects()].map(x => x.width)) / zoom) + 8 + 'px';
    }
    const fade = ease((time - cue.start) / 0.2);
    name.style.opacity = fade; line.style.opacity = fade;
  } else { name.style.opacity = 0; line.style.opacity = 0; }
  $('sub').style.transform = `translateY(${62 * full}px)`;
  drawObservatory(time, full);
  drawBand(time, full);
};

if (!location.search.includes('static')) {
  const t0 = performance.now();
  (function loop() { window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
